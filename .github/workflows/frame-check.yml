name: 쇼핑몰 페이지 안 표시 자동 점검

# 매일 쇼핑몰마다 "다른 사이트 안 표시" 를 허락하는지 응답 헤더로 확인한다.
# 새로 막힌 곳(또는 다시 허용된 곳)이 있으면 data/frame-status.js 를 고쳐 커밋하고 사이트를 다시 배포한다.
# 그러면 화면이 그 쇼핑몰을 알아서 새 창으로 연다. AGENTS.md 3항 "막힘 자동 점검" 참고.
on:
  schedule:
    - cron: '17 0 * * *'   # 매일 09:17 (한국 시각). GitHub 사정으로 몇십 분 늦게 돌 수 있다
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 표시 허용 여부 점검
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 점검
        id: check
        run: node scripts/frame-check.js

      - name: 바뀌었으면 커밋
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/frame-status.js
          git commit -m "자동 점검: 쇼핑몰 페이지 안 표시 상태 갱신"
          git push

  deploy:
    name: 다시 배포
    needs: check
    if: needs.check.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: main
