name: 테스트 후 GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 배포에 필요한 최소 권한만 부여한다.
permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않도록 한 번에 하나만 진행한다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # AGENTS.md 규칙 1 — 테스트를 모두 통과해야 배포로 넘어간다.
  test:
    name: Playwright 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 전체 테스트 실행
        run: npx playwright test

      - name: 실패 시 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Pages 배포
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # 실제 페이지에 필요한 파일만 추린다. (테스트·서버·스크립트·설정은 배포하지 않는다)
      - name: 배포할 파일 모으기
        run: |
          mkdir -p _site/data _site/icons
          cp index.html app.js manifest.webmanifest sw.js _site/
          cp data/malls.js _site/data/
          cp icons/*.png _site/icons/
          find _site -type f

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
